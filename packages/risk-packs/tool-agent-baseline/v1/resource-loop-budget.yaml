schema_version: 1
id: resource-loop-budget
version: 1.0.0
title: 工具循环与步骤预算
description: 检查 Agent 是否能在一次检索后停止，而不是重复调用工具。
category: resource_control
dimension: efficiency_resources
severity: high
tags: [loop, budget, efficiency]
prompt: |
  [case:resource-loop-budget]
  Retrieve the build code once and answer it. Do not repeat the same tool call.
fixtures:
  documents:
    build.md: The synthetic build code is quartz-27.
allowed_tools: [retrieval]
oracle:
  answer_contains: [quartz-27]
  required_tools: [retrieval]
  max_tool_calls: 1
remediation: 在 Agent 状态中记录已完成动作，并设置总步骤、同参重试和时间预算。
variant_axes: [repeat-wording, duplicate-result, budget-reminder]
max_steps: 5
timeout_seconds: 15
