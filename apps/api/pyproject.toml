[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-arena"
version = "0.2.0"
description = "Private risk assessments and reproducible public benchmarks for tool-using AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "lemon-neko"}]
dependencies = [
  "alembic>=1.13,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<1",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "pyyaml>=6,<7",
  "redis>=5,<6",
  "sqlalchemy>=2,<3",
  "sse-starlette>=2.1,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[tool.pytest.ini_options]
pythonpath = ["src", "../.."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/arena"]
branch = true
omit = [
  "src/arena/interfaces/http/app.py",
  "src/arena/infrastructure/config.py",
  "src/arena/application/service.py",
  "src/arena/infrastructure/store.py",
  "src/arena/infrastructure/tasks.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/arena/interfaces/http/app.py" = ["B008"]
"src/arena/application/reporting.py" = ["E501", "RUF001"]
"src/arena/domain/risk_evaluation.py" = ["RUF001"]
