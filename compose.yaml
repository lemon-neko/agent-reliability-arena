name: agent-reliability-arena

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - arena-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://arena:arena@postgres:5432/arena
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      MODEL_BASE_URL: ${MODEL_BASE_URL:-fake://deterministic}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-fake-deterministic}
      ALLOW_EXTERNAL_MODELS: ${ALLOW_EXTERNAL_MODELS:-false}
      SCENARIO_DIR: /app/packages/scenarios/catalog
      RUNTIME_DIR: /app/runtime
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - arena-runtime:/app/runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["celery", "-A", "arena.infrastructure.tasks:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    volumes:
      - arena-runtime:/app/runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  arena-postgres:
  arena-runtime:
