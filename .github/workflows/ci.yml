name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: arena
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arena -d arena"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e 'apps/api[dev]'
      - run: make lint-api
      - run: make test-api
      - run: make check-scenarios
      - run: make check-risk-packs
      - run: make check-registry
      - run: make check-governance
      - name: Require a change note for material changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_change_note.py --base "$BASE_SHA"
      - run: make security
      - run: alembic -c alembic.ini upgrade head
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://arena:arena@127.0.0.1:5432/arena

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm lint
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
      - run: VITE_DEMO_MODE=true pnpm build --mode demo
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm test:e2e
        working-directory: apps/web
